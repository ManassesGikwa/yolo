# roles/frontend-deployment/tasks/main.yml
---
- name: Pull image from repository
  docker_image:
    name: manassesg/yolo-backend:latest
    source: pull

- name: Create Node.js frontend Container
  docker_container:
    name: yolo-client
    image: manassesg/yolo-backend:latest
    networks:
      - name: app-net
    ports:
      - "3000:3000"
    command: "npm start"
    restart_policy: unless-stopped
  become: yes